name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node: build frontend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Python: install deps, copy frontend build to STATIC_ROOT, collectstatic, run tests
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Copy frontend build into STATIC_ROOT
        run: |
          python - <<'PY'
          from pathlib import Path, shutil
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','backend.settings')
          import django; django.setup()
          src = Path('frontend/dist'); dst = Path.home() / 'inventory_static'
          dst.mkdir(parents=True, exist_ok=True)
          for p in src.rglob('*'):
              if p.is_file():
                  target = dst / p.relative_to(src)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, target)
          print('Copied frontend ->', dst)
          PY
      - name: Run collectstatic
        run: |
          python backend/manage.py collectstatic --noinput
      - name: Run tests
        run: |
          python -m pytest -q
