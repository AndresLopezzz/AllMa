name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Start a Postgres service for tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Expose the default port; GitHub Actions maps service ports to localhost
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval=5s --health-timeout=5s --health-retries=20

    # Provide DB environment variables so Django picks up a working DB configuration
    env:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun (for frontend)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.0.0"

      - name: Install and build frontend with Bun
        working-directory: frontend
        run: |
          bun install
          bun run build:ci

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Wait for Postgres to be ready
        # Simple TCP wait loop against localhost:5432 (works on GitHub Actions runners)
        run: |
          echo "Waiting for Postgres on localhost:5432..."
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
              echo "Postgres is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Copy frontend build into Django STATIC_ROOT
        run: |
          chmod +x ./scripts/copy_frontend_to_static.sh || true
          bash ./scripts/copy_frontend_to_static.sh

      - name: Collect static files
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python backend/manage.py collectstatic --noinput -v 2

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest -q
